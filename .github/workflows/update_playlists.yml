name: Update YouTube Playlists

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install yt-dlp
      run: python -m pip install yt-dlp
        
    - name: Run Scraper
      run: python update_playlists.py
      
    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add assets/js/data.js
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update playlist tracks from YouTube" && git push)
