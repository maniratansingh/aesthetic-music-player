<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c22" />
      <stop offset="40%" stop-color="#121216" />
      <stop offset="85%" stop-color="#09090c" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fc3c44" />
      <stop offset="70%" stop-color="#d9222a" />
      <stop offset="100%" stop-color="#8c1015" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#0c0c10" />
  
  <!-- Outer vinyl platter ring -->
  <circle cx="256" cy="256" r="216" fill="url(#discGrad)" stroke="#272730" stroke-width="4" />
  
  <!-- Subtle vinyl groove rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />
  
  <!-- Center record label -->
  <circle cx="256" cy="256" r="82" fill="url(#centerGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="82" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Center spindle hole -->
  <circle cx="256" cy="256" r="20" fill="#0c0c10" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" />
  
  <!-- Modern clean music note symbol -->
  <path d="M246 226 L276 218 L276 250 A 10 10 0 1 1 266 240 A 10 10 0 0 1 276 250 L276 224 L252 230 L252 260 A 10 10 0 1 1 242 250 A 10 10 0 0 1 252 260 Z" fill="#ffffff" opacity="0.95" />
</svg>
