<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRPS Music</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=79">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="glcanvas"></canvas>

    <div class="app">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <a class="brand" href="https://mrps.in" target="_blank" rel="noopener" title="Visit mrps.in">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
                    <div class="brand-text">
                        <span class="brand-name">MRPS MUSIC</span>
                        <span class="brand-domain">mrps.in</span>
                    </div>
                </a>

                <!-- SEARCH -->
                <div class="search-wrap" id="search-wrap">
                    <div class="search-box" id="search-box">
                        <svg class="search-icon" id="search-icon-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-input" placeholder="Search songs, artists..." autocomplete="off" spellcheck="false">
                        <div class="search-spinner" id="search-spinner" style="display:none">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
                        </div>
                        <button id="btn-search-clear" class="search-clear-btn" type="button" style="display:none" title="Clear">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <!-- SEARCH RESULTS DROPDOWN -->
                    <div class="search-dropdown" id="search-dropdown">
                        <div class="search-recommendations" id="search-recommendations">
                            <div class="search-section-label">Quick Picks</div>
                            <div class="search-chips" id="search-chips"></div>
                            <div class="search-section-label" id="recents-label" style="display:none">Recent Searches</div>
                            <div class="search-recents" id="search-recents"></div>
                        </div>
                        <div class="search-results-list" id="search-results-list" style="display:none"></div>
                    </div>
                </div>

                <nav id="playlist-nav"></nav>
            </div>
            <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        </aside>

        <!-- PLAYER -->
        <main class="player" id="player">
            <div class="mobile-bar">
                <button class="icon-btn" id="btn-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <span id="mobile-playlist-name">Select Playlist</span>
                <button class="icon-btn" id="btn-queue-mobile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg></button>
            </div>

            <div class="disk-wrap">
                <div class="tonearm-base"></div>
                <div class="tonearm" id="tonearm">
                    <div class="tonearm-rotor">
                        <div class="tonearm-counterweight"></div>
                        <div class="tonearm-pivot"></div>
                        <div class="tonearm-arm">
                            <div class="tonearm-connector"></div>
                            <div class="tonearm-head">
                                <div class="tonearm-fingerlift"></div>
                                <div class="tonearm-cartridge"></div>
                                <div class="tonearm-stylus"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="disk" id="disk">
                    <div class="disk-grooves"></div>
                    <div class="disk-label" id="disk-label">
                        <div class="disk-hole"></div>
                    </div>
                </div>
            </div>

            <div class="meta">
                <h2 class="meta-title" id="track-title">Not Playing</h2>
                <p class="meta-artist" id="track-artist">Select a playlist to begin</p>
            </div>

            <div class="scrubber-wrap">
                <div class="scrubber-track" id="scrubber-track">
                    <div class="scrubber-fill" id="scrubber-fill"></div>
                    <div class="scrubber-thumb" id="scrubber-thumb"></div>
                </div>
                <div class="scrubber-times">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="player-bottom">
                <button class="mute-btn-standalone" id="btn-mute" title="Toggle Mute">
                    <span class="mute-label">MUTE</span>
                    <svg id="icon-vol-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:block"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <svg id="icon-vol-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                </button>

                <div class="controls">
                    <button class="ctrl" id="btn-prev" title="Previous Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
                    <button class="ctrl play" id="btn-play" title="Play / Pause">
                        <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl" id="btn-next" title="Next Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm8.5-12v12h2V6h-2z"/></svg></button>
                </div>

                <div class="volume-slider-wrap">
                    <svg class="vol-icon vol-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
                    <input type="range" id="volume-slider-side" min="0" max="100" value="100" title="Volume">
                    <svg class="vol-icon vol-up" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </div>
            </div>
        </main>

        <!-- QUEUE -->
        <aside class="queue" id="queue">
            <div class="queue-header">
                <div class="queue-header-left">
                    <h3>Up Next</h3>
                    <span class="queue-count-badge" id="queue-count">0 tracks</span>
                </div>
                <div class="queue-actions">
                    <button class="queue-action-btn" id="btn-shuffle-queue" title="Shuffle Upcoming Tracks">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                    </button>
                    <button class="queue-action-btn" id="btn-locate-playing" title="Jump to Playing Track">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle></svg>
                    </button>
                    <button class="icon-btn" id="btn-close-queue" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                </div>
            </div>
            <div class="queue-list" id="track-list"></div>
        </aside>
    </div>

    <div id="yt-player-container" class="yt-audio-frame">
        <div id="yt-player"></div>
    </div>

    <script src="assets/js/data.js?v=79"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="assets/js/shader.js?v=79"></script>
    <script src="assets/js/app.js?v=79"></script>
</body>
</html>
