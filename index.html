<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura — Music</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=40">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="glcanvas"></canvas>

    <div class="app">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                                <div class="brand">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>Aura</span>
                </div>
                <div class="search-box">
                    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Search songs, artists..." autocomplete="off">
                    <button id="btn-search" title="Search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
                <nav id="playlist-nav"></nav>
            </div>
            <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
        </aside>

        <!-- PLAYER -->
        <main class="player" id="player">
            <div class="mobile-bar">
                <button class="icon-btn" id="btn-menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <span id="mobile-playlist-name">Select Playlist</span>
                <button class="icon-btn" id="btn-queue-mobile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg></button>
            </div>

            <div class="disk-wrap">
                <div class="tonearm-base"></div>
                <div class="tonearm" id="tonearm">
                    <div class="tonearm-rotor">
                        <div class="tonearm-counterweight"></div>
                        <div class="tonearm-pivot"></div>
                        <div class="tonearm-arm">
                            <div class="tonearm-connector"></div>
                            <div class="tonearm-head">
                                <div class="tonearm-fingerlift"></div>
                                <div class="tonearm-cartridge"></div>
                                <div class="tonearm-stylus"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="disk" id="disk">
                    <div class="disk-grooves"></div>
                    <div class="disk-label" id="disk-label">
                        <div class="disk-hole"></div>
                    </div>
                </div>
            </div>

            <div class="meta">
                <h2 class="meta-title" id="track-title">Not Playing</h2>
                <p class="meta-artist" id="track-artist">Select a playlist to begin</p>
            </div>

            <div class="scrubber-wrap">
                <div class="scrubber-track" id="scrubber-track">
                    <div class="scrubber-fill" id="scrubber-fill"></div>
                    <div class="scrubber-thumb" id="scrubber-thumb"></div>
                </div>
                <div class="scrubber-times">
                    <span id="time-current">0:00</span>
                    <span id="time-total">0:00</span>
                </div>
            </div>

            <div class="player-bottom">
                <button class="mute-btn-standalone" id="btn-mute" title="Toggle Mute">
                    <span class="mute-label">MUTE</span>
                    <svg id="icon-vol-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:block"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <svg id="icon-vol-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                </button>

                <div class="controls">
                    <button class="ctrl" id="btn-prev" title="Previous Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
                    <button class="ctrl play" id="btn-play" title="Play / Pause">
                        <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="ctrl" id="btn-next" title="Next Track"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm8.5-12v12h2V6h-2z"/></svg></button>
                </div>

                <div class="volume-slider-wrap">
                    <svg class="vol-icon vol-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
                    <input type="range" id="volume-slider-side" min="0" max="100" value="100" title="Volume">
                    <svg class="vol-icon vol-up" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </div>
            </div>
        </main>

        <!-- QUEUE -->
        <aside class="queue" id="queue">
            <div class="queue-header">
                <div class="queue-header-left">
                    <h3>Up Next</h3>
                    <span class="queue-count" id="queue-count">0 tracks</span>
                </div>
                <button class="icon-btn" id="btn-close-queue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div class="queue-list" id="track-list"></div>
            
            
        </aside>
    </div>

    <div style="position:fixed;width:1px;height:1px;opacity:0.01;z-index:-100;pointer-events:none;overflow:hidden"><div id="yt-player"></div></div>

    <script src="assets/js/data.js?v=40"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="assets/js/shader.js?v=40"></script>
    <script src="assets/js/app.js?v=40"></script>
</body>
</html>
